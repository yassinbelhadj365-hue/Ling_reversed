# Builds the phone apps from the web app (docs/MOBILE.md):
#   - Android: lingo-reader.apk, signed with your own key (repository secrets), to install directly
#   - iOS: lingo-reader-unsigned.ipa, to sign and install with Sideloadly and a free Apple ID
# Run it from the Actions tab (Run workflow), or push a tag like v1.0 to also attach both files
# to a GitHub Release.
name: Phone apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Copy the web app and create the Android project
        run: |
          node copy-web.mjs
          npx cap add android
          npx cap sync android
      - name: App icon from icon.svg
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 ../icon.svg -o assets/icon.png
          cp assets/icon.png assets/icon-only.png
          rsvg-convert -w 2732 -h 2732 -b '#1f6feb' ../icon.svg -o assets/splash.png
          npx capacitor-assets generate --android
      - name: Build
        working-directory: mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then ./gradlew assembleRelease --no-daemon; else ./gradlew assembleDebug --no-daemon; fi
      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p ../out
          if [ -z "$KEYSTORE_B64" ]; then
            # No key set up yet: a debug build. It installs fine, but each build has a different key,
            # so updating needs an uninstall (which deletes the app's data). See docs/MOBILE.md.
            cp android/app/build/outputs/apk/debug/app-debug.apk ../out/lingo-reader.apk
            echo "::warning::No signing key in the repository secrets: built a debug APK. Set up a key (docs/MOBILE.md) so updates keep your data."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          # A .pfx made on Windows (docs/MOBILE.md) holds a single key, so the alias is optional.
          "$BT/apksigner" sign --ks release.jks --ks-pass env:KEYSTORE_PASSWORD ${KEY_ALIAS:+--ks-key-alias "$KEY_ALIAS"} \
            --out ../out/lingo-reader.apk aligned.apk
          rm release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: lingo-reader-android
          path: out/lingo-reader.apk
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/lingo-reader.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Copy the web app and create the iOS project
        run: |
          node copy-web.mjs
          npx cap add ios
          npx cap sync ios
      - name: App icon from icon.svg
        continue-on-error: true
        run: |
          brew install librsvg
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 ../icon.svg -o assets/icon.png
          cp assets/icon.png assets/icon-only.png
          rsvg-convert -w 2732 -h 2732 -b '#1f6feb' ../icon.svg -o assets/splash.png
          npx capacitor-assets generate --ios
      - name: Build (unsigned)
        working-directory: mobile/ios/App
        run: |
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package the .ipa
        run: |
          mkdir -p ../out Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ../out/lingo-reader-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: lingo-reader-ios
          path: out/lingo-reader-unsigned.ipa
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/lingo-reader-unsigned.ipa
