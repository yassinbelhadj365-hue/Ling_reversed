// A scriptable stand-in for the YouTube/media player (js/player.js test hook).
function makeFakePlayer() {
  const fake = { t: 0, playing: false, seeks: [], media: null, handlers: {} };
  const emit = (e, ...a) => (fake.handlers[e] || []).forEach((fn) => fn(...a));
  fake.set = (t, playing = fake.playing) => { fake.t = t; if (playing !== fake.playing) { fake.playing = playing; emit('state', playing); } };
  fake.factory = (box, media) => {
    fake.media = media;
    box.innerHTML = '<div class="fake-player" style="height:200px;background:#000"></div>';
    return {
      kind: 'fake',
      getTime: () => fake.t,
      isPlaying: () => fake.playing,
      play: () => fake.set(fake.t, true),
      pause: () => fake.set(fake.t, false),
      seek: (t) => { fake.t = t; fake.seeks.push(t); },
      setRate: () => {},
      on: (e, fn) => { (fake.handlers[e] ||= []).push(fn); },
      destroy: () => { fake.handlers = {}; },
    };
  };
  return fake;
}

const log = [];
let fails = 0;
const ok = (cond, msg) => { log.push(`${cond ? 'PASS' : 'FAIL'} ${msg}`); if (!cond) fails++; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms = 5000) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) { try { const v = fn(); if (v) return v; } catch {} await sleep(50); }
  return null;
}

try {
  // ---- unit: tokenizer / parsers ----
  ok(tokenize("L'homme d'aujourd'hui", 'fr').filter((t) => t.n).map((t) => t.n).join('|') === "l'|homme|d'|aujourd'hui", 'French elision split');
  ok(tokenize("I don't know 42 things", 'en').filter((t) => t.n).map((t) => t.n).join('|') === "i|don't|know|things", 'English contraction kept, numbers skipped');
  ok(tokenize('Привет, мир!', 'ru').filter((t) => t.n).length === 2, 'Cyrillic words');
  const srt = `1\n00:00:01,000 --> 00:00:03,000\nHola a todos\n\n2\n00:00:03,500 --> 00:00:05,000\n<i>bienvenidos.</i>\n`;

  ok(p1.timed && p1.segments.length === 2 && p1.segments[1].start === 3.5 && p1.segments[1].text === 'bienvenidos.', 'SRT parse');
  const vtt = `WEBVTT\n\n00:00:00.000 --> 00:00:02.000\nhola amigos\n\n00:00:02.000 --> 00:00:04.000\nhola amigos\nqué tal\n`;
  ok(parseSubtitles(vtt).map((c) => c.text).join('|') === 'hola amigos|qué tal', 'VTT rolling captions de-duplicated');
  const yt = `0:00\nhola a todos\n0:03\nhoy vamos a hablar\n1:02:05\nde comida.\n`;
  const p2 = parseAny(yt);
  ok(p2.timed && p2.segments.length === 3 && p2.segments[2].start === 3725, 'YouTube transcript paste parse');
  ok(mergeCues(p2.segments).length === 1, 'Cue merge to sentence');
  const merged = mergeCues(p2.segments)[0];
  ok(merged.marks?.length === 3 && merged.marks[1][0] === 'hola a todos '.length && merged.marks[2][1] === 3725, 'merged line keeps each cue start as a mark');
  ok(p1.segments[0].end === 3, 'SRT end time kept');
  const AUTO_VTT = `WEBVTT\nKind: captions\nLanguage: es\n\n` +
    `00:00:01.000 --> 00:00:03.000 align:start position:0%\n \nHola<00:00:01.500><c> a</c><00:00:02.000><c> todos</c>\n\n` +
    `00:00:03.000 --> 00:00:03.010 align:start position:0%\nHola a todos\n \n\n` +
    `00:00:03.010 --> 00:00:05.000 align:start position:0%\nHola a todos\ny<00:00:03.500><c> bienvenidos.</c>\n`;
  const auto = parseSubtitles(AUTO_VTT);
  ok(auto.map((c) => c.text).join('|') === 'Hola a todos|y bienvenidos.', 'auto-captions: rolling repeats dropped, inline tags stripped');
  ok(JSON.stringify(auto[0].marks) === '[[0,1],[5,1.5],[7,2]]', 'auto-captions: word timestamps kept as marks ' + JSON.stringify(auto[0].marks));
  const am = mergeCues(auto)[0];
  ok(am.text === 'Hola a todos y bienvenidos.' && JSON.stringify(am.marks.at(-1)) === '[15,3.5]', 'merged auto-captions keep word marks ' + JSON.stringify(am.marks));
  ok(youTubeId('https://youtu.be/dQw4w9WgXcQ?t=3') === 'dQw4w9WgXcQ' && youTubeId('https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=x') === 'dQw4w9WgXcQ', 'YouTube id');
  const g = grade({ status: 1, srs: freshSrs() }, 'good');
  ok(g.status === 2 && g.srs.interval === 1, 'SRS good: level up, 1 day');
  ok(grade({ status: 3, srs: freshSrs() }, 'again').status === 1, 'SRS again: back to level 1');

  // ---- unit: automatic word levels (knowledge.js) ----
  const apply = (w, r) => (r ? { ...w, status: r.status, ev: r.ev } : w);
  const fresh = () => ({ term: 'x', status: 0 });
  const o = (day = 'd1', extra = {}) => ({ day, pace: 'normal', listenPasses: 2, autoAdjustManual: true, now: 1e12, ...extra });
  ok(apply(fresh(), onPass(fresh(), 'read', o())).status === 5, 'auto: new + read pass → known');
  let w = apply(fresh(), onPass(fresh(), 'listen', o()));
  ok(w.status === 0, 'auto: new + 1 listen pass → still new');
  ok(apply(w, onPass(w, 'listen', o())).status === 5, 'auto: new + 2 listen passes → known');
  ok(apply(fresh(), onPass(fresh(), 'listen', o('d1', { listenPasses: 1 }))).status === 5, 'auto: listenPasses=1 → known after 1 listen');
  w = apply(fresh(), onLookup(fresh(), o()));
  ok(w.status === 1, 'auto: lookup → LingQ 1');
  w = apply(w, onPass(w, 'read', o())); w = apply(w, onPass(w, 'read', o()));
  ok(w.status === 2, 'auto: 2 clean encounters → level 2');
  w = apply(w, onPass(w, 'read', o()));
  ok(onPass(w, 'read', o()) === null, 'auto: 4th encounter on the same day ignored');
  for (const d of ['d2', 'd3', 'd4']) for (let i = 0; i < 3; i++) w = apply(w, onPass(w, 'read', o(d)));
  ok(w.status === 5, `auto: ~10 clean encounters over 4 days → known (status ${w.status})`);
  ok(apply({ term: 'x', status: 3 }, onLookup({ term: 'x', status: 3 }, o())).status === 2, 'auto: lookup on level 3 → 2');
  let m = { term: 'x', status: 5 }; m.ev = onManual(m, 5);
  ok(apply(m, onLookup(m, o())).status === 5, 'auto: manual Known survives a lookup');
  m = { term: 'x', status: 2 }; m.ev = onManual(m, 2);
  ok(onPass(m, 'read', o('d1', { autoAdjustManual: false })) === null, 'auto: manual level 2 pinned when adjusting is off');
  w = apply(fresh(), onLookup(fresh(), o()));
  ok(undoPatch(w).status === 0, 'auto: undo restores previous status');
  const r = { term: 'x', status: 4, ev: { base: 4, since: 0, look: 1 } };
  ok(onReview(r, 'good', { status: 4, srs: { interval: 25 } }).status === 5, 'auto: review interval ≥21 days → known');
  ok(onReview(r, 'again', { status: 1, srs: { interval: 0 } }).status === 1, 'auto: review again → level 1');

  // ---- unit: exact context + translation helpers ----
  const para = 'Las casas son grandes. Compré la casa ayer. ¿Y tú?';
  ok(sentenceAt(para, para.indexOf('la casa')).sentence === 'Compré la casa ayer.', 'sentenceAt: the sentence of the tapped occurrence');
  const sa = sentenceAt(para, para.indexOf('la casa'));
  ok(para.slice(sa.start, sa.start + 6) === 'Compré', 'sentenceAt: start offset points at the sentence');
  ok(sentenceAt('sin puntuación aquí nada', 5).sentence === 'sin puntuación aquí nada', 'sentenceAt: no punctuation → whole text');
  ok(hash32('hola') === hash32('hola') && hash32('hola') !== hash32('Hola'), 'hash32 stable and case-sensitive');
  const ec = expressionCandidates('Lo hizo a pesar de todo.', 'Lo hizo a pesar de todo.'.indexOf('pesar'), 'es');
  ok(ec[0].surface === 'hizo a pesar' && ec.some((c) => c.surface === 'a pesar de') && ec.length === 5, 'expressionCandidates: 3- and 2-word runs around the word');

  // ---- unit: AI helpers (ai.js) ----
  ok(parseJsonReply('Sure!\n```json\n{"translation":"here"}\n```').translation === 'here', 'parseJsonReply: strips fences');
  const realFetchU = window.fetch;
  window.fetch = async () => new Response(JSON.stringify({ models: [
    { name: 'models/gemini-2.0-flash', displayName: 'Gemini 2.0 Flash', supportedGenerationMethods: ['generateContent'] },
    { name: 'models/gemini-2.5-flash-lite', displayName: 'Gemini 2.5 Flash-Lite', supportedGenerationMethods: ['generateContent'] },
    { name: 'models/text-embedding-004', supportedGenerationMethods: ['embedContent'] },
    { name: 'models/gemini-2.5-flash', displayName: 'Gemini 2.5 Flash', supportedGenerationMethods: ['generateContent'] },
  ] }));
  const models = await listModels('k');
  window.fetch = realFetchU;
  ok(models.map((m) => m.id).join() === 'gemini-2.5-flash,gemini-2.5-flash-lite,gemini-2.0-flash', 'Gemini models: newest stable Flash first, no embedding models ' + models.map((m) => m.id));
  // A model whose free limit is used up: the next free Flash model answers, and it is skipped afterwards.
  const asked = [];
  window.fetch = async (url) => {
    const u = String(url);
    if (/\/models\?/.test(u)) return new Response(JSON.stringify({ models: [
      { name: 'models/gemini-2.5-flash', supportedGenerationMethods: ['generateContent'] },
      { name: 'models/gemini-2.5-flash-lite', supportedGenerationMethods: ['generateContent'] },
      { name: 'models/gemini-2.5-pro', supportedGenerationMethods: ['generateContent'] }] }));
    const m = /models\/([^:]+):generateContent/.exec(u)[1];
    asked.push(m);
    if (m === 'gemini-2.5-flash') return new Response(JSON.stringify({ error: { code: 429, message: 'Quota exceeded',
      details: [{ violations: [{ quotaId: 'GenerateRequestsPerDayPerProjectPerModel-FreeTier' }] }] } }), { status: 429 });
    return new Response(JSON.stringify({ candidates: [{ content: { parts: [{ text: '{"translation":"ok"}' }] } }] }));
  };
  _resetModels();
  const fb1 = await direct('k', { system: 's', user: 'u' });
  const fb2 = await direct('k', { system: 's', user: 'u' });
  window.fetch = realFetchU;
  _resetModels();
  ok(fb1.model === 'gemini-2.5-flash-lite' && fb1.result.translation === 'ok' && fb2.model === 'gemini-2.5-flash-lite'

    'when Flash’s daily free limit is used up, Flash-Lite answers, and Flash is skipped until it resets: ' + asked);
  // Google is busy (503) on every Flash model: one quick second try, the next Flash model, then Gemma.
  const busyAsked = [], googleList = { models: ['gemini-3.6-flash', 'gemini-3.6-flash-lite', 'gemma-4-26b-a4b-it'].map((id) =>
    ({ name: `models/${id}`, supportedGenerationMethods: ['generateContent'] })) };
  const busy = () => new Response(JSON.stringify({ error: { code: 503, message: 'This model is currently experiencing high demand.' } }), { status: 503 });
  let gemmaBody = null;
  window.__lingoBusyWait = 0;
  window.fetch = async (url, opts) => {
    const u = String(url);
    if (/\/models\?/.test(u)) return new Response(JSON.stringify(googleList));
    const m = /models\/([^:]+):generateContent/.exec(u)[1];
    busyAsked.push(m);
    if (!/^gemma/.test(m)) return busy();
    gemmaBody = JSON.parse(opts.body);
    return new Response(JSON.stringify({ candidates: [{ content: { parts: [{ text: '```json\n{"translation":"g"}\n```' }] } }] }));
  };
  _resetModels();
  const gb = await direct('k', { system: 'sys', user: 'u', schema: { type: 'OBJECT', properties: { translation: { type: 'STRING' } } } });
  ok(gb.model === 'gemma-4-26b-a4b-it' && gb.result.translation === 'g'
    && busyAsked.join() === 'gemini-3.6-flash,gemini-3.6-flash,gemini-3.6-flash-lite,gemma-4-26b-a4b-it'
    && !gemmaBody.systemInstruction && !gemmaBody.generationConfig.responseMimeType && /"translation":""/.test(gemmaBody.contents[0].parts[0].text),
    'when Google is busy: one retry, the next Flash model, then Gemma with the JSON shape in the prompt: ' + busyAsked);
  // Every Google model busy: the user's Mistral backup answers; videos never go to a backup.
  const savedKeys = await Promise.all(['secret:gemini', 'secret:mistral', 'secret:groq'].map((k) => db.getSetting(k, '')));
  await db.setSetting('secret:gemini', 'k');
  await db.setSetting('secret:mistral', 'mk');
  await db.setSetting('secret:groq', '');
  let mistralReq = null;
  window.fetch = async (url, opts) => {
    const u = String(url);
    if (/\/models\?/.test(u)) return new Response(JSON.stringify(googleList));
    if (/api\.mistral\.ai/.test(u)) {
      mistralReq = { auth: opts.headers.Authorization, body: JSON.parse(opts.body) };
      return new Response(JSON.stringify({ choices: [{ message: { content: '{"translation":"m"}' } }] }));
    }
    return busy();
  };
  _resetModels();
  const mb = await geminiJson({ system: 'sys', user: 'u', schema: { type: 'OBJECT', properties: { translation: { type: 'STRING' } } } });
  let videoErr = '';
  try { await geminiJson({ system: 's', user: 'u', video: { url: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ' } }); } catch (e) { videoErr = e.message; }
  ok(mb.model === 'mistral-small-latest' && mb.result.translation === 'm' && mistralReq.auth === 'Bearer mk'
    && mistralReq.body.response_format.type === 'json_object' && /Reply with JSON only/.test(mistralReq.body.messages[0].content)
    && /busy/i.test(videoErr), 'when every Google model is busy, the Mistral backup answers; a video gets Google’s busy error: ' + videoErr);
  await db.setSetting('secret:gemini', '');
  ok((await hasProvider()) && !(await hasProvider({ video: true })), 'a backup key alone is enough for lookups, not for videos');
  ok(keyKind(' AIzaSyD-abcdefghijklmnopqrstuvwxyz0123 ') === 'gemini' && keyKind('gsk_' + 'x'.repeat(40)) === 'groq'
    && keyKind('aB3'.repeat(10) + 'zz') === 'mistral' && keyKind('hello there') === null, 'a pasted key is recognized by its look');
  await Promise.all(['secret:gemini', 'secret:mistral', 'secret:groq'].map((k, i) => db.setSetting(k, savedKeys[i])));
  window.fetch = realFetchU;
  delete window.__lingoBusyWait;
  _resetModels();
  await db.setSetting('secret:test', 'sk-123');
  ok(!(await db.exportAll()).data.kv.some((r) => r.key.startsWith('secret:')), 'backups never contain API keys');
  await db.del('kv', 'secret:test');

  // ---- unit: short lookup contexts for auto-captions (text.js contextAt) ----
  const FR = 'dessous et toi et moi je reste dans la gourmandise dans le chocolat et je vais prendre de la pâte à tartiner au [Musique] chocolat je tartine bien la confiture par-dessus le beurre en une couche épaisse et je vais';
  const at = (s, w) => s.indexOf(w);
  const cw = contextAt({ text: FR }, at(FR, 'confiture'));
  ok(cw.sentence.split(' ').length <= 26 && cw.sentence.includes('confiture') && !cw.sentence.includes('Musique')
    && FR.slice(cw.start, cw.start + cw.sentence.length) === cw.sentence, 'contextAt: unpunctuated text → a window around the word, cut at [Musique]: ' + cw.sentence);
  const cues = ['dessous et toi', 'et moi je reste dans la gourmandise', 'dans le chocolat et je vais prendre', 'de la pâte à tartiner au chocolat',
    'je tartine bien la confiture', 'par-dessus le beurre en une couche épaisse'].map((text, k) => ({ text, start: k * 2 }));
  const mergedFr = mergeCues(cues, 220, 1000)[0];
  const cc = contextAt(mergedFr, at(mergedFr.text, 'confiture'));
  ok(cc.sentence === 'dans le chocolat et je vais prendre de la pâte à tartiner au chocolat je tartine bien la confiture par-dessus le beurre en une couche épaisse',
    'contextAt: in auto-captions, whole caption lines around the word until about 20 words: ' + cc.sentence);
  const longCues = Array.from({ length: 12 }, (_, k) => ({ text: `uno dos tres cuatro cinco seis siete ocho nueve diez${k}`, start: k * 3 }));
  const lm = mergeCues(longCues, 1e4, 1e4)[0];
  const lc = contextAt(lm, lm.text.indexOf('diez6'));
  ok(lc.sentence.split(' ').length >= 20 && lc.sentence.split(' ').length <= 40 && lc.sentence.includes('diez6'), 'contextAt: never more than about 40 words: ' + lc.sentence.split(' ').length);
  ok(contextAt({ text: 'Hola. Compré la casa ayer. ¿Y tú?' }, 10).sentence === 'Compré la casa ayer.', 'contextAt: punctuated text → its sentence');
  ok(mergeCues(cues).length >= 3 && mergeCues(cues).every((c) => c.text.length < 100), 'mergeCues: unpunctuated captions stay short lines');

  // ---- unit: forgiving streak (state.js streakOf) ----
  const actDays = (list) => new Map(list.map((d) => [`2026-10-${String(d).padStart(2, '0')}`, { secs: 60 }]));
  const NOW = new Date(2026, 9, 18, 15);
  const sk1 = streakOf(actDays([18, 17, 16, 14, 13, 10]), NOW);
  ok(sk1.days === 5 && sk1.saved === 1, 'streak: one missed day a week is saved, two in a row end it ' + JSON.stringify(sk1));
  const sk2 = streakOf(actDays([17, 16]), NOW);
  ok(sk2.days === 2 && sk2.saved === 0, 'streak: today still counts later, so yesterday’s streak shows ' + JSON.stringify(sk2));
  const sk3 = streakOf(actDays([18, 16, 14, 13]), NOW);
  ok(sk3.days === 2 && sk3.saved === 1, 'streak: only one saved day per week ' + JSON.stringify(sk3));
  ok(streakOf(new Map(), NOW).days === 0, 'streak: nothing yet');

  // ---- unit: Gemini video transcripts (video-ai.js, ai.js) ----
  ok(parseStamp('01:05') === 65 && parseStamp('1:02:03') === 3723 && parseStamp('75.5s') === 75.5 && parseStamp(12) === 12 && Number.isNaN(parseStamp('soon')), 'parseStamp');
  const vb = requestBody({ system: 's', user: 'u', video: { url: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ', start: 600, end: 1200 } });
  ok(vb.contents[0].parts[0].fileData.fileUri.endsWith('dQw4w9WgXcQ') && vb.contents[0].parts[0].videoMetadata.startOffset === '600s'
    && vb.contents[0].parts[1].text === 'u' && vb.generationConfig.mediaResolution === 'MEDIA_RESOLUTION_LOW'
    && !requestBody({ system: 's', user: 'u' }).generationConfig.mediaResolution, 'a video request sends the YouTube link and the part, at low resolution');

  // ---- unit: stories (story.js) ----
  ok(levelOf(100).cefr === 'A1' && levelOf(1500).cefr === 'B1' && levelOf(20000).cefr === 'C1', 'levelOf');
  const sv = new Map([['a', { term: 'a', status: 1, createdAt: 1 }], ['b', { term: 'b', status: 4 }], ['c', { term: 'c', status: 5 }], ['d', { term: 'd', status: 0 }], ['e', { term: 'e', status: 2 }]]);
  ok(pickTargets(sv, 2, () => 0.99).sort().join() === 'a,e' && pickTargets(sv, 9).length === 3, 'pickTargets: LingQs only, the weakest first');

  // ---- unit: milestones and the weekly recap (progress.js) ----
  ok(milestoneFor(99) === 0 && milestoneFor(100) === 100 && milestoneFor(999) === 500 && milestoneFor(12000) === 10000, 'milestoneFor');
  const mon = weekStart(new Date(2026, 9, 18, 15)); // Sunday 18 Oct 2026 → Monday 12 Oct
  ok(mon.getDate() === 12 && mon.getDay() === 1 && mon.getHours() === 0, 'weekStart: Monday 00:00 of the week');
  const pageState = await import('../js/state.js');
  const savedVocab = pageState.state.vocab;
  const mk = (term, status, knownAt) => [term, { term, status, knownAt, isPhrase: term.includes(' ') }];
  pageState.state.vocab = new Map([mk('uno', 5, +new Date(2026, 9, 13)), mk('dos', 5, +new Date(2026, 9, 5)), mk('tres', 2, 0), mk('a b', 5, +new Date(2026, 9, 14))]);
  const nextMon = new Date(mon); nextMon.setDate(mon.getDate() + 7);
  const rc = recapOf(new Map([['2026-10-12', { date: '2026-10-12', secs: 600, lingqs: 2 }], ['2026-10-14', { date: '2026-10-14', secs: 300, lingqs: 0, reviews: 3 }], ['2026-10-05', { date: '2026-10-05', secs: 900 }]]), mon, nextMon);
  ok(rc.learned.join() === 'uno' && rc.mins === 15 && rc.days === 2 && rc.lingqs === 2, 'recapOf: words learned that week (no phrases), minutes, active days, LingQs ' + JSON.stringify(rc));
  // a milestone: the first check only records where you are; crossing the next one celebrates
  await db.del('kv', 'milestone|es');
  pageState.state.vocab = new Map(Array.from({ length: 99 }, (_, k) => mk(`w${k}`, 5, 1)));
  await checkMilestone();
  ok(!document.querySelector('.celebrate') && (await db.getSetting('milestone|es', null)) === 0, 'milestones: the first check is silent');
  pageState.state.vocab.set('w99', { term: 'w99', status: 5 });
  await checkMilestone();
  ok(/100 Spanish words known/.test(document.querySelector('.celebrate h2')?.textContent || ''), 'milestones: reaching 100 known words celebrates');
  document.querySelector('.celebrate [data-close]').click();
  await checkMilestone();
  ok(!document.querySelector('.celebrate'), 'milestones: each one is celebrated once');
  await db.del('kv', 'milestone|es');
  pageState.state.vocab = savedVocab;

  // ---- unit: progress toward the next milestone, how far through a lesson, Continue ----
  const mp = milestoneProgress(208);
  ok(mp.from === 100 && mp.to === 250 && mp.left === 42 && mp.pct === 72 && milestoneProgress(10001) === null, 'milestoneProgress: the stretch to the next milestone ' + JSON.stringify(mp));
  ok(/42<\/b> words to 250 known/.test(milestoneBarHtml(208)), 'the bar says how many words to go');
  ok(lessonProgress({ segments: [{ start: 0 }, { start: 100 }], lastTime: 42 }) === 42 && lessonProgress({ wordCount: 1000, page: 2 }, 250) === 50

  });
  db.useDatabase('migtest');
  const migLessons = await db.all('lessons');
  const migWord = await db.get('words', 'es|hola');
  const migAct = await db.all('activity');
  ok(typeof migLessons[0].id === 'string' && migWord.lessons[0] === migLessons[0].id, 'migration: lesson ids become unique strings, word links follow');
  ok(migAct[0].key.split('|').length === 3 && migAct[0].known === 3, 'migration: activity rows get a device id, counts kept');
  db.useDatabase(null);
  indexedDB.deleteDatabase('lingo-reader-migtest');

  // ---- accounts + sync between two devices (in-memory stand-in for Supabase) ----
  const cloud = await import('../js/cloud.js');
  let cloudFn = null; // the fake server's "transcript" Edge Function, when deployed
  const server = (() => {
    const users = new Map(), rows = new Map();
    let clock = 0;
    const json = (o, status = 200) => new Response(JSON.stringify(o), { status, headers: { 'content-type': 'application/json' } });
    const session = (u) => ({ access_token: `tok-${u.id}`, refresh_token: 'r', expires_in: 3600, user: { id: u.id, email: u.email, user_metadata: { name: u.name } } });
    return async (url, opts = {}) => {
      const u = new URL(url);
      const body = typeof opts.body === 'string' ? JSON.parse(opts.body) : null;
      if (u.pathname === '/auth/v1/signup') {
        const user = { id: `user${users.size + 1}`, email: body.email, password: body.password, name: body.data?.name };
        users.set(body.email, user);
        return json(session(user));
      }
      if (u.pathname === '/auth/v1/token') {
        const user = users.get(body.email);
        return user && user.password === body.password ? json(session(user)) : json({ error_description: 'Invalid login credentials' }, 400);
      }
      const uid = (opts.headers?.Authorization || '').replace('Bearer tok-', '');
      if (u.pathname === '/rest/v1/rpc/push_records') {
        for (const r of body.rows) {
          const k = `${uid}|${r.kind}|${r.key}`;
          const old = rows.get(k);
          if (!old || r.updated_at > old.updated_at) rows.set(k, { ...r, synced_at: new Date(Date.UTC(2026, 0, 1) + ++clock).toISOString() });
        }
        return new Response(null, { status: 204 });
      }
      if (u.pathname === '/functions/v1/transcript') {
        return cloudFn && opts.headers?.Authorization?.startsWith('Bearer tok-') ? json(cloudFn(u.searchParams)) : json({ message: 'Function not found' }, 404);
      }
      if (u.pathname === '/rest/v1/records') {
        const from = u.searchParams.get('synced_at').replace('gte.', '');
        return json([...rows].filter(([k]) => k.startsWith(`${uid}|`)).map(([, r]) => r)
          .filter((r) => r.synced_at >= from).sort((a, b) => (a.synced_at < b.synced_at ? -1 : 1))
          .slice(0, Number(u.searchParams.get('limit'))));
      }
      return json({ message: 'not found' }, 404);
    };
  })();
  const pageFetch = window.fetch;
  window.fetch = (url, opts) => (String(url).startsWith('https://fake.supabase.test') ? server(url, opts) : pageFetch(url, opts));
  const savedLs = Object.fromEntries(['lingo-cloud', 'lingo-accounts', 'lingo-active'].map((k) => [k, localStorage.getItem(k)]));
  cloud.setCloudConfig('https://fake.supabase.test', 'anon-key');
  const acc = await cloud.signUp('ana@example.com', 'secret1', 'Ana');
  ok(acc.id === 'user1' && cloud.accounts().some((a) => a.email === 'ana@example.com'), 'create an account');
  localStorage.setItem('lingo-active', JSON.stringify(acc.id));

  // device A (computer): some progress, then sync
  db.useDatabase(`${acc.id}-A`);
  await db.put('lessons', { id: 'lA', lang: 'es', title: 'Lección', segments: [{ text: 'Hola mundo.' }], words: { hola: 1, mundo: 1 } });
  await db.put('words', { key: 'es|mundo', lang: 'es', term: 'mundo', status: 2, hint: 'world', lessons: ['lA'] });
  await db.setSetting('settings', { lang: 'es', native: 'en', dailyGoal: 33 });
  await db.setSetting('secret:openrouter', 'sk-should-stay-here');
  await cloud.syncNow();
  ok(cloud.status.state === 'ok', 'device A synced: ' + cloud.status.state + ' ' + cloud.status.error);

  // device B (phone): log in, everything arrives (except the secret key)
  await cloud.logIn('ana@example.com', 'secret1');
  db.useDatabase(`${acc.id}-B`);
  await cloud.syncNow();
  const bLesson = await db.get('lessons', 'lA'), bWord = await db.get('words', 'es|mundo');
  ok(bLesson?.segments[0].text === 'Hola mundo.' && bWord?.hint === 'world' && (await db.getSetting('settings')).dailyGoal === 33,
    'device B receives lessons, transcripts, words and settings');
  ok(!(await db.getSetting('secret:openrouter')), 'API keys are not synced');

  // B changes the word (newer), A deletes the lesson: each device gets the other's change
  await new Promise((r) => setTimeout(r, 5));
  await db.put('words', { ...bWord, status: 5, hint: 'world (known)' });
  await cloud.syncNow();
  db.useDatabase(`${acc.id}-A`);
  await db.del('lessons', 'lA');
  await cloud.syncNow();
  ok((await db.get('words', 'es|mundo'))?.status === 5, 'a change made on the phone reaches the computer');
  db.useDatabase(`${acc.id}-B`);
  await cloud.syncNow();
  ok(!(await db.get('lessons', 'lA')), 'a lesson deleted on the computer disappears from the phone');

  // ---- a phone asks the computer to fetch a YouTube transcript (through the synced account) ----
  const relay = await import('../js/relay.js');
  const savedDevice = localStorage.getItem('lingo-device');
  let serverUp = false;
  const ytCalls = [];
  window.fetch = (url, opts) => {
    const s = String(url);
    if (s.startsWith('https://fake.supabase.test')) return server(url, opts);
    if (s.startsWith('api/')) {
      if (!serverUp) return Promise.resolve(new Response('Not found', { status: 404, headers: { 'content-type': 'text/plain' } }));
      if (s.startsWith('api/capabilities')) return Promise.resolve(new Response(JSON.stringify({ transcripts: true, audio: false }), { headers: { 'content-type': 'application/json' } }));
      ytCalls.push(s);
      const body = /track=1/.test(s)
        ? { ok: true, title: 'Desde el ordenador', vtt: AUTO_VTT, track: { index: 1, lang: 'es', kind: 'auto', name: 'Spanish (auto)' } }
        : { ok: false, error: 'no-track', title: 'Desde el ordenador', tracks: [{ index: 0, lang: 'en', kind: 'manual', name: 'English' }, { index: 1, lang: 'es', kind: 'auto', name: 'Spanish (auto)' }] };
      return Promise.resolve(new Response(JSON.stringify(body), { headers: { 'content-type': 'application/json' } }));
    }
    return pageFetch(url, opts);
  };
  // Let background syncs finish before switching to the other device's database.
  const idle = async () => { await cloud.syncNow(); while (cloud.status.state === 'syncing') await sleep(20); };
  const asDevice = async (name, dbSuffix, up) => {
    await idle();
    relay._resetRelay();
    localStorage.setItem('lingo-device', name);
    db.useDatabase(`${acc.id}-${dbSuffix}`);
    serverUp = up;
    await idle();
  };
  await asDevice('devPhone', 'B', false);
  ok(relay.canRelay() && !(await relay.serverCaps()).transcripts, 'the phone has no transcript server but can ask its computer');
  ok(await relay.fetchTranscript('dQw4w9WgXcQ', 'es') === null && relay.cloudOutcome === 'missing', 'no cloud helper deployed: nothing fetched');
  cloudFn = (q) => ({ ok: true, title: 'Por la nube', vtt: AUTO_VTT, track: { index: 0, lang: q.get('lang'), kind: 'auto', name: 'Spanish (auto)' }, tracks: [] });
  const viaCloud = await relay.fetchTranscript('dQw4w9WgXcQ', 'es');
  ok(viaCloud?.ok && viaCloud.via === 'cloud' && viaCloud.title === 'Por la nube', 'with the cloud helper, the phone fetches the transcript itself (logged-in token sent)');
  cloudFn = () => ({ ok: false, error: 'blocked' });
  ok(await relay.fetchTranscript('dQw4w9WgXcQ', 'es') === null && relay.cloudOutcome === 'blocked', 'when YouTube refuses the cloud helper, it falls back to asking the computer');
  cloudFn = null;
  // in the phone app (Capacitor), the phone downloads the captions itself
  const fetchBefore = window.fetch;
  const ytSeen = [];
  window.Capacitor = { isNativePlatform: () => true };
  window.fetch = async (url, opts) => {
    const u = String(url);
    if (u.startsWith('https://www.youtube.com/youtubei/v1/player')) {
      ytSeen.push(opts.headers['User-Agent']);
      return new Response(JSON.stringify({ playabilityStatus: { status: 'OK' }, videoDetails: { title: 'En el teléfono' },
        captions: { playerCaptionsTracklistRenderer: { captionTracks: [
          { languageCode: 'en', kind: 'asr', name: { simpleText: 'English (auto)' }, baseUrl: 'https://yt.test/en?x=1' },
          { languageCode: 'es', name: { simpleText: 'Español' }, baseUrl: 'https://yt.test/es?x=1&fmt=srv3' }] } } }));
    }
    if (u.startsWith('https://yt.test/es')) return new Response(u.endsWith('&fmt=vtt') ? AUTO_VTT : 'wrong format');
    return fetchBefore(url, opts);
  };
  const viaPhone = await relay.fetchTranscript('dQw4w9WgXcQ', 'es');
  delete window.Capacitor;
  window.fetch = fetchBefore;
  ok(viaPhone?.ok && viaPhone.via === 'phone' && viaPhone.title === 'En el teléfono' && viaPhone.track.lang === 'es' && viaPhone.vtt === AUTO_VTT
    && /android/i.test(ytSeen[0]), 'in the phone app, the phone downloads the Spanish captions itself (as the YouTube app)');
  const job = await relay.requestImport({ kind: 'transcript', videoId: 'dQw4w9WgXcQ', url: 'https://youtu.be/dQw4w9WgXcQ', title: '', track: '', merge: true });
  await cloud.syncNow();
  ok(/Waiting for your computer/.test(relay.jobStatusText(job)), 'the request waits for the computer');
  await asDevice('devPC', 'A', true);
  await relay.processRelay();
  let pcJob = (await relay.jobs()).find((j) => j.id === job.id);
  ok(pcJob?.status === 'error' && pcJob.error === 'no-track' && pcJob.tracks?.length === 2, 'the computer reports when there are no captions in the language, with the other tracks');
  await cloud.syncNow();
  await asDevice('devPhone', 'B', false);
  await relay.processRelay();
  ok((await relay.myJobs())[0]?.status === 'error', 'the phone sees the error');
  await relay.retryJob(job.id, { track: '1' });
  await cloud.syncNow();
  await asDevice('devPC', 'A', true);
  await relay.processRelay();
  pcJob = (await relay.jobs()).find((j) => j.id === job.id);
  ok(pcJob?.status === 'ready' && /WEBVTT/.test(pcJob.vtt) && ytCalls.at(-1).includes('track=1'), 'with another track chosen, the computer fetches the transcript');
  ok(!(await db.all('lessons')).some((l) => l.youtubeId === 'dQw4w9WgXcQ'), 'the computer doesn’t import it itself');
  await cloud.syncNow();
  await asDevice('devPhone', 'B', false);
  await relay.processRelay();
  const relayed = (await db.all('lessons')).find((l) => l.youtubeId === 'dQw4w9WgXcQ');
  ok(relayed?.title === 'Desde el ordenador' && relayed.segments.length === 1 && relayed.segments[0].marks?.length === 5,
    'the lesson appears on the phone, timed, with the video title');
  await idle();
  const poolWord = await db.get('words', 'es|bienvenidos'), leftJobs = await relay.myJobs();
  ok(poolWord?.lessons?.includes(relayed.id) && !leftJobs.length,
    'its words join the phone’s pool and the request is cleared ' + JSON.stringify([poolWord?.lessons, relayed.id, leftJobs.map((j) => j.status)]));
  await cloud.syncNow();
  await asDevice('devPC', 'A', true);
  ok((await db.all('lessons')).some((l) => l.id === relayed.id) && !(await relay.jobs()).length, 'the lesson syncs back to the computer; the request is gone');
  relay._resetRelay();
  savedDevice === null ? localStorage.removeItem('lingo-device') : localStorage.setItem('lingo-device', savedDevice);
  window.fetch = (url, opts) => (String(url).startsWith('https://fake.supabase.test') ? server(url, opts) : pageFetch(url, opts));

  // a second account has its own separate data
  const acc2 = await cloud.signUp('ben@example.com', 'secret2', 'Ben');
  localStorage.setItem('lingo-active', JSON.stringify(acc2.id));
  db.useDatabase(`${acc2.id}-A`);
  await cloud.syncNow();
  ok(!(await db.get('words', 'es|mundo')) && cloud.accounts().length >= 2, 'a second account starts empty and keeps its own data');

  // clean up
  db.useDatabase(null);
  window.fetch = pageFetch;
  for (const [k, v] of Object.entries(savedLs)) v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v);
  for (const n of [`${acc.id}-A`, `${acc.id}-B`, `${acc2.id}-A`]) indexedDB.deleteDatabase(`lingo-reader-${n}`);

  // AI setup: one row per AI; a key pasted in the wrong box is saved where it belongs and checked.
  W().location.hash = '#/settings/ai';
  await until(() => D().querySelector('#ai-card [data-key="groq"]'));
  const rows = [...D().querySelectorAll('#ai-card .ai-row[data-p]')].map((r) => r.dataset.p);
  ok(rows.join() === 'gemini,mistral,groq' && D().querySelector('#key-paste')
    && D().querySelector('[data-get="mistral"]').href.startsWith('https://console.mistral.ai/'),
    'Settings → AI: Gemini, Mistral and Groq, each with a key link, plus one Paste button: ' + rows);
  const frameFetch = W().fetch;
  let groqAuth = '';
  W().fetch = async (url, opts) => {
    if (/api\.groq\.com/.test(String(url))) {
      groqAuth = opts.headers.Authorization;
      return new Response(JSON.stringify({ choices: [{ message: { content: '{"translation":"Hello everyone."}' } }] }));
    }
    return frameFetch(url, opts);
  };
  const groqKey = 'gsk_' + 'a1'.repeat(15);
  const gmBox = D().querySelector('[data-key="gemini"]');
  gmBox.value = groqKey;
  gmBox.dispatchEvent(new Event('change'));
  await until(() => /✓/.test(D().querySelector('#st-groq').textContent));
  ok(D().querySelector('[data-key="groq"]').value === groqKey && !gmBox.value && groqAuth === `Bearer ${groqKey}`
    && /Hello everyone/.test(D().querySelector('#st-groq').textContent),
    'a Groq key pasted in the Gemini box is saved for Groq and checked: ' + D().querySelector('#st-groq').textContent);
  const groqBox = D().querySelector('[data-key="groq"]');
  groqBox.value = '';
  groqBox.dispatchEvent(new Event('change'));
  await until(() => /Not set up/.test(D().querySelector('#st-groq').textContent));
  W().fetch = frameFetch;

  // setting: don't ask the AI automatically (saves the daily limit)
  const appState = await W().eval("import('/js/state.js')");
  const appPanel = await W().eval("import('/js/panel.js')");
  appState.state.settings.aiAuto = false;
  const callsBefore = aiCalls.length;
  appPanel.openPanel('casa', { context: 'Esta casa es grande.' });
  ok(D().querySelector('#word-panel [data-act="explain"]') && aiCalls.length === callsBefore, 'with automatic answers off, the panel waits for the button');
  appPanel.closePanel();
  appState.state.settings.aiAuto = true;

  ok(!D().body.dataset.error, 'no runtime errors: ' + (D().body.dataset.error || 'none'));
} catch (e) {
  ok(false, 'exception: ' + e.stack);
}
document.getElementById('out').textContent = `${fails ? 'FAILED ' + fails : 'ALL PASSED'}\n` + log.join('\n');
document.body.dataset.done = '1';
</script>
