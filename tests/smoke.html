// A scriptable stand-in for the YouTube/media player (js/player.js test hook).
function makeFakePlayer() {
  const fake = { t: 0, playing: false, seeks: [], media: null, handlers: {} };
  const emit = (e, ...a) => (fake.handlers[e] || []).forEach((fn) => fn(...a));
  fake.set = (t, playing = fake.playing) => { fake.t = t; if (playing !== fake.playing) { fake.playing = playing; emit('state', playing); } };
  fake.factory = (box, media) => {
    fake.media = media;
    box.innerHTML = '<div class="fake-player" style="height:200px;background:#000"></div>';
    return {
      kind: 'fake',
      getTime: () => fake.t,
      isPlaying: () => fake.playing,
      play: () => fake.set(fake.t, true),
      pause: () => fake.set(fake.t, false),
      seek: (t) => { fake.t = t; fake.seeks.push(t); },
      setRate: () => {},
      on: (e, fn) => { (fake.handlers[e] ||= []).push(fn); },
      destroy: () => { fake.handlers = {}; },
    };
  };
  return fake;
}

const log = [];
let fails = 0;
const ok = (cond, msg) => { log.push(`${cond ? 'PASS' : 'FAIL'} ${msg}`); if (!cond) fails++; };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, ms = 5000) {
  const t0 = Date.now();
  while (Date.now() - t0 < ms) { try { const v = fn(); if (v) return v; } catch {} await sleep(50); }
  return null;
}

try {
  // ---- unit: tokenizer / parsers ----
  ok(tokenize("L'homme d'aujourd'hui", 'fr').filter((t) => t.n).map((t) => t.n).join('|') === "l'|homme|d'|aujourd'hui", 'French elision split');
  ok(tokenize("I don't know 42 things", 'en').filter((t) => t.n).map((t) => t.n).join('|') === "i|don't|know|things", 'English contraction kept, numbers skipped');
  ok(tokenize('Привет, мир!', 'ru').filter((t) => t.n).length === 2, 'Cyrillic words');
  const srt = `1\n00:00:01,000 --> 00:00:03,000\nHola a todos\n\n2\n00:00:03,500 --> 00:00:05,000\n<i>bienvenidos.</i>\n`;
  const p1 = parseAny(srt, 'a.srt');
  ok(p1.timed && p1.segments.length === 2 && p1.segments[1].start === 3.5 && p1.segments[1].text === 'bienvenidos.', 'SRT parse');
  const vtt = `WEBVTT\n\n00:00:00.000 --> 00:00:02.000\nhola amigos\n\n00:00:02.000 --> 00:00:04.000\nhola amigos\nqué tal\n`;
  ok(parseSubtitles(vtt).map((c) => c.text).join('|') === 'hola amigos|qué tal', 'VTT rolling captions de-duplicated');
  const yt = `0:00\nhola a todos\n0:03\nhoy vamos a hablar\n1:02:05\nde comida.\n`;
  const p2 = parseAny(yt);
  ok(p2.timed && p2.segments.length === 3 && p2.segments[2].start === 3725, 'YouTube transcript paste parse');
  ok(mergeCues(p2.segments).length === 1, 'Cue merge to sentence');
  const merged = mergeCues(p2.segments)[0];
  ok(merged.marks?.length === 3 && merged.marks[1][0] === 'hola a todos '.length && merged.marks[2][1] === 3725, 'merged line keeps each cue start as a mark');
  ok(p1.segments[0].end === 3, 'SRT end time kept');
  const AUTO_VTT = `WEBVTT\nKind: captions\nLanguage: es\n\n` +
    `00:00:01.000 --> 00:00:03.000 align:start position:0%\n \nHola<00:00:01.500><c> a</c><00:00:02.000><c> todos</c>\n\n` +
    `00:00:03.000 --> 00:00:03.010 align:start position:0%\nHola a todos\n \n\n` +
    `00:00:03.010 --> 00:00:05.000 align:start position:0%\nHola a todos\ny<00:00:03.500><c> bienvenidos.</c>\n`;
  const auto = parseSubtitles(AUTO_VTT);
  ok(auto.map((c) => c.text).join('|') === 'Hola a todos|y bienvenidos.', 'auto-captions: rolling repeats dropped, inline tags stripped');
  ok(JSON.stringify(auto[0].marks) === '[[0,1],[5,1.5],[7,2]]', 'auto-captions: word timestamps kept as marks ' + JSON.stringify(auto[0].marks));
  const am = mergeCues(auto)[0];
  ok(am.text === 'Hola a todos y bienvenidos.' && JSON.stringify(am.marks.at(-1)) === '[15,3.5]', 'merged auto-captions keep word marks ' + JSON.stringify(am.marks));
  ok(youTubeId('https://youtu.be/dQw4w9WgXcQ?t=3') === 'dQw4w9WgXcQ' && youTubeId('https://www.youtube.com/watch?v=dQw4w9WgXcQ&list=x') === 'dQw4w9WgXcQ', 'YouTube id');
  const g = grade({ status: 1, srs: freshSrs() }, 'good');
  ok(g.status === 2 && g.srs.interval === 1, 'SRS good: level up, 1 day');
  ok(grade({ status: 3, srs: freshSrs() }, 'again').status === 1, 'SRS again: back to level 1');

  // ---- unit: automatic word levels (knowledge.js) ----
  const apply = (w, r) => (r ? { ...w, status: r.status, ev: r.ev } : w);
  const fresh = () => ({ term: 'x', status: 0 });
  const o = (day = 'd1', extra = {}) => ({ day, pace: 'normal', listenPasses: 2, autoAdjustManual: true, now: 1e12, ...extra });
  ok(apply(fresh(), onPass(fresh(), 'read', o())).status === 5, 'auto: new + read pass → known');
  let w = apply(fresh(), onPass(fresh(), 'listen', o()));
  ok(w.status === 0, 'auto: new + 1 listen pass → still new');
  ok(apply(w, onPass(w, 'listen', o())).status === 5, 'auto: new + 2 listen passes → known');
  ok(apply(fresh(), onPass(fresh(), 'listen', o('d1', { listenPasses: 1 }))).status === 5, 'auto: listenPasses=1 → known after 1 listen');
  w = apply(fresh(), onLookup(fresh(), o()));
  ok(w.status === 1, 'auto: lookup → LingQ 1');
  w = apply(w, onPass(w, 'read', o())); w = apply(w, onPass(w, 'read', o()));
  ok(w.status === 2, 'auto: 2 clean encounters → level 2');
  w = apply(w, onPass(w, 'read', o()));
  ok(onPass(w, 'read', o()) === null, 'auto: 4th encounter on the same day ignored');
  for (const d of ['d2', 'd3', 'd4']) for (let i = 0; i < 3; i++) w = apply(w, onPass(w, 'read', o(d)));
  ok(w.status === 5, `auto: ~10 clean encounters over 4 days → known (status ${w.status})`);
  ok(apply({ term: 'x', status: 3 }, onLookup({ term: 'x', status: 3 }, o())).status === 2, 'auto: lookup on level 3 → 2');
  let m = { term: 'x', status: 5 }; m.ev = onManual(m, 5);
  ok(apply(m, onLookup(m, o())).status === 5, 'auto: manual Known survives a lookup');
  m = { term: 'x', status: 2 }; m.ev = onManual(m, 2);
  ok(onPass(m, 'read', o('d1', { autoAdjustManual: false })) === null, 'auto: manual level 2 pinned when adjusting is off');
  w = apply(fresh(), onLookup(fresh(), o()));
  ok(undoPatch(w).status === 0, 'auto: undo restores previous status');
  const r = { term: 'x', status: 4, ev: { base: 4, since: 0, look: 1 } };
  ok(onReview(r, 'good', { status: 4, srs: { interval: 25 } }).status === 5, 'auto: review interval ≥21 days → known');
  ok(onReview(r, 'again', { status: 1, srs: { interval: 0 } }).status === 1, 'auto: review again → level 1');
  ok(computeStatus({ look: 0, base: 0, pre: 1 }) === 0, 'auto: computeStatus pre < threshold stays new');

  // ---- unit: exact context + translation helpers ----
  const para = 'Las casas son grandes. Compré la casa ayer. ¿Y tú?';
  ok(sentenceAt(para, para.indexOf('la casa')).sentence === 'Compré la casa ayer.', 'sentenceAt: the sentence of the tapped occurrence');
  const sa = sentenceAt(para, para.indexOf('la casa'));
  ok(para.slice(sa.start, sa.start + 6) === 'Compré', 'sentenceAt: start offset points at the sentence');
  ok(sentenceAt('sin puntuación aquí nada', 5).sentence === 'sin puntuación aquí nada', 'sentenceAt: no punctuation → whole text');
  const long = 'palabra '.repeat(120);
  const chunks = chunkForMyMemory(long, 100);
  ok(chunks.every((c) => new TextEncoder().encode(c).length <= 100) && chunks.join(' ').split(/\s+/).length === 120, 'chunkForMyMemory: byte limit, no split words');
  ok(hash32('hola') === hash32('hola') && hash32('hola') !== hash32('Hola'), 'hash32 stable and case-sensitive');
  const mm = { responseData: { translatedText: "- Today we're going to talk about" }, matches: [
    { segment: 'Hoy vamos a hablar de', translation: "- Today we're going to talk about", 'created-by': 'MateCat' },
    { segment: 'Hoy vamos a hablar de comida.', translation: "Today we're going to talk about food.", 'created-by': 'MT!' },
  ] };
  ok(pickMyMemory(mm, 'Hoy vamos a hablar de comida.') === "Today we're going to talk about food.", 'MyMemory: fuzzy match for another sentence loses to the machine translation');
  const rk = rankByContext([{ source: 'MyMemory', text: 'meal' }, { source: 'MyMemory', text: 'food' }], 'Today we will talk about food.', 'en');
  ok(rk[0].text === 'food' && rk[0].fits && !rk[1].fits, 'rankByContext: the candidate found in the sentence translation ranks first');
  ok(rankByContext([{ source: 'Wiktionary', text: 'to speak, talk' }], 'They talked all night', 'en')[0].fits, 'rankByContext: stem match (talk ~ talked)');
  const formHtml = '<span class="form-of-definition"><a title="Appendix:Glossary">first-person</a> plural of <span class="form-of-definition-link"><i><a title="hablar">hablar</a></i></span></span>';
  const fd = parseDefinition(formHtml, 'Verb');
  ok(fd.formOf === 'hablar' && /plural of hablar/.test(fd.text), 'parseDefinition: inflected form → lemma');
  const ec = expressionCandidates('Lo hizo a pesar de todo.', 'Lo hizo a pesar de todo.'.indexOf('pesar'), 'es');
  ok(ec[0].surface === 'hizo a pesar' && ec.some((c) => c.surface === 'a pesar de') && ec.length === 5, 'expressionCandidates: 3- and 2-word runs around the word');

  // ---- unit: "still unclear" helpers ----
  ok(parseJsonReply('<think>hmm {no}</think>Sure!\n```json\n{"gloss_in_context":"here"}\n```').gloss_in_context === 'here', 'parseJsonReply: strips reasoning and fences');
  const realFetchU = window.fetch;
  window.fetch = async () => new Response(JSON.stringify({ data: [
    { id: 'deepseek/deepseek-v4-pro', pricing: { prompt: '0.0000006', completion: '0.000002' } },
    { id: 'google/gemma-4-31b-it:free', pricing: { prompt: '0', completion: '0' } },
    { id: 'nvidia/nemotron-3-ultra-550b-a55b:free', pricing: { prompt: '0', completion: '0' } },
  ] }));
  const models = await listModels();
  window.fetch = realFetchU;
  ok(models.map((m) => m.id).join() === 'nvidia/nemotron-3-ultra-550b-a55b:free,google/gemma-4-31b-it:free', 'only free models are offered (paid DeepSeek excluded), strongest first');
  await db.setSetting('secret:test', 'sk-123');
  ok(!(await db.exportAll()).data.kv.some((r) => r.key.startsWith('secret:')), 'backups never contain API keys');
  await db.del('kv', 'secret:test');

  // ---- unit: transcript check (check.js) ----
  const cf = compareLine('Esta es la frase número 2 del vídeo largo.', 'Esta es la frase número dos del video largo', 'es');
  ok(cf.length === 1 && cf[0].said === 'vídeo' && cf[0].heard === 'video', 'compareLine: flags the word the audio says differently ' + JSON.stringify(cf));
  ok(!compareLine('Hola a todos', 'Hola a todos y bienvenidos', 'es').length, 'compareLine: extra heard words from a neighbour line are not mistakes');
  ok(!compareLine('Una frase completamente distinta aquí', 'nada que ver con esto ahora', 'es').length, 'compareLine: unreliable recognition (little overlap) flags nothing');
  const edge = compareLine('Hola amigo mío', 'bueno pues Hola amiga mío', 'es');
  ok(edge.length === 1 && edge[0].heard === 'amiga', 'compareLine: substitution in the middle');
  const lead = compareLine('Pero hola amigo mío', 'lo dijo y hola amigo mío', 'es');
  ok(lead.length === 1 && lead[0].said === 'Pero' && lead[0].heard === 'y', 'compareLine: at the line start only the adjacent heard word is suggested');
  const hb = heardBetween([{ start: 8, end: 12, text: 'A' }, { start: 12, end: 16, text: 'B' }], 8, 12);
  ok(hb === 'A', 'heardBetween: a neighbouring cue that barely overlaps is left out');

  // ---- unit: timeline (sync.js) ----
  const tl = buildTimeline([{ text: 'a b', start: 0 }, { text: 'c d', start: 4 }, { text: 'e f', start: 9 }]);
  ok(tl.map((x) => x.end).join() === '4,9,21', 'timeline: ends from next start, last capped');
  ok(activeIndex(tl, 4).idx === 1 && activeIndex(tl, -1).idx === -1 && activeIndex(tl, 30).inGap, 'timeline: active line, before start, gap');
  const seg = { text: 'aaaa bbbb', marks: [[0, 0], [5, 2]] };
  ok(charAt(seg, { start: 0, end: 4 }, 1) === 3 && charAt(seg, { start: 0, end: 4 }, 3) === 7, 'timeline: charAt interpolates between marks');

  // ---- e2e through the real app ----
  const frame = document.getElementById('app');
  const W = () => frame.contentWindow;
  const D = () => frame.contentDocument;
  await until(() => D().body?.dataset.ready === '1', 8000);
  ok(D().body.dataset.ready === '1', 'app booted');

  // fresh language for a clean slate
  const sel = D().getElementById('lang-select');
  sel.value = 'es'; sel.dispatchEvent(new Event('change'));
  await sleep(300);

  async function importLesson(title, text, yt = '') {
    W().location.hash = '#/import';
    await until(() => D().getElementById('text'));
    D().getElementById('title').value = title;
    D().getElementById('yt').value = yt;
    const ta = D().getElementById('text');
    ta.value = text;
    ta.dispatchEvent(new Event('input'));
    await until(() => D().getElementById('preview').textContent);
    const preview = D().getElementById('preview').textContent;
    D().getElementById('go').click();
    await until(() => W().location.hash.startsWith('#/lesson/'));
    await until(() => D().querySelectorAll('#reader .w').length);
    return preview;
  }
  const fake = makeFakePlayer();
  W().__lingoFakePlayer = fake.factory;
  const EN = { 'Hoy vamos a hablar de comida.': "Today we're going to talk about food." };
  W().__lingoTranslate = async (text) => ({ text: EN[text] || '[EN] ' + text, source: 'Test' });
  W().__lingoDict = async (term) => term === 'comida'
    ? [{ source: 'MyMemory', pos: 'translation', text: 'meal' }, { source: 'MyMemory', pos: 'translation', text: 'food' }]
    : [];
  W().__lingoExpr = async (surface) => surface === 'de comida' ? [{ source: 'Wiktionary', pos: 'Phrase', text: '(test) about food' }] : [];

  // ---- page mode: a timed transcript without media ----
  const preview = await importLesson('Prueba', `0:00\nHola a todos, bienvenidos al canal.\n0:04\nHoy vamos a hablar de comida.\n0:09\nLa comida española es muy rica.\n`);
  ok(/Timed transcript/.test(preview), 'import preview: ' + preview);
  ok(W().location.hash.startsWith('#/lesson/'), 'navigated to lesson');
  const spans = [...D().querySelectorAll('#reader .w')];
  ok(spans.length === 18, `reader rendered ${spans.length} word spans`);
  ok(spans.every((s) => s.classList.contains('st-0')), 'all words start blue (new)');
  ok(!D().getElementById('view').classList.contains('listen') && D().querySelector('.pager'), 'no media → page mode');

  // click a word, make it LingQ level 2
  const comida = spans.find((s) => s.dataset.n === 'comida');
  comida.click();
  await until(() => !D().getElementById('word-panel').hidden);
  ok(D().querySelector('.panel-word').textContent === 'comida', 'panel opened for word');
  await until(() => D().querySelector('#reader .w[data-n="comida"]').classList.contains('st-1'));
  ok([...D().querySelectorAll('#reader .w[data-n="comida"]')].every((s) => s.classList.contains('st-1')), 'tapping a word made it LingQ 1 automatically');
  ok(/Auto/.test(D().querySelector('#word-panel .auto-line')?.textContent || ''), 'panel shows the automatic-level line');
  ok(D().querySelector('#word-panel .ctx-sentence mark')?.textContent === 'comida', 'panel marks the tapped word in its sentence');
  await until(() => /^Today/.test(D().querySelector('#word-panel .ctx-tr')?.textContent || ''));
  ok(/^Today we're going to talk about food\./.test(D().querySelector('#word-panel .ctx-tr')?.textContent || ''), 'panel translates the exact sentence: ' + D().querySelector('#word-panel .ctx-tr')?.textContent);
  await until(() => D().querySelector('#word-panel .meaning-here'));
  ok(/food/.test(D().querySelector('#word-panel .meaning-here')?.textContent || ''), '"Meaning here" picks the dictionary sense that fits the sentence (food, not meal)');
  ok(D().querySelector('#word-panel .ctx-tr mark')?.textContent === 'food', 'the matching word is highlighted in the translation');
  await until(() => /de comida/.test(D().querySelector('#word-panel #dict-area')?.textContent || ''));
  ok(/Expression\s*de comida/.test(D().querySelector('#word-panel #dict-area').textContent.replace(/\s+/g, ' ')), 'an expression around the word is detected');
  ok(!D().querySelector('#word-panel #ai-area').textContent.trim(), 'no on-device AI here → no AI section');
  D().querySelector('#reader .tr-btn[data-tr="2"]').click();
  await until(() => /^\[EN\] La comida/.test(D().querySelector('#reader p[data-i="2"] .tr')?.textContent || ''));
  ok(/^\[EN\] La comida/.test(D().querySelector('#reader p[data-i="2"] .tr')?.textContent || ''), 'line translation button shows the line in English');
  D().querySelector('#word-panel [data-s="2"]').click();
  await sleep(300);
  ok([...D().querySelectorAll('#reader .w[data-n="comida"]')].every((s) => s.classList.contains('st-2')), 'both "comida" now LingQ 2 (yellow)');
  const hint = D().getElementById('hint');
  hint.value = 'food'; hint.dispatchEvent(new Event('change'));
  await sleep(200);

  // phrase selection: "muy rica"
  const muy = D().querySelector('#reader .w[data-n="muy"]');
  const rica = D().querySelector('#reader .w[data-n="rica"]');
  const range = D().createRange();
  range.setStartBefore(muy); range.setEndAfter(rica);
  W().getSelection().removeAllRanges(); W().getSelection().addRange(range);
  D().getElementById('reader').dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
  await until(() => D().querySelector('.panel-word')?.textContent === 'muy rica');
  ok(D().querySelector('.panel-word')?.textContent === 'muy rica', 'phrase panel opened');
  D().querySelector('#word-panel [data-s="1"]').click();
  await sleep(300);
  ok(muy.parentNode && D().querySelector('#reader .w[data-n="muy"]').classList.contains('in-phrase'), 'phrase underlined');

  // complete the lesson: unclicked blue words become known
  D().querySelector('#word-panel [data-act="close"]').click();
  D().getElementById('next').click();
  await until(() => /Lesson complete/.test(D().getElementById('reader').textContent));
  ok(/Lesson complete/.test(D().getElementById('reader').textContent), 'lesson completed');
  ok(/13 words moved to known/.test(D().getElementById('reader').textContent), 'completion reports 13 words moved to known by reading');
  ok(/\+13 known/.test(D().getElementById('session-chip').textContent), 'session chip: ' + D().getElementById('session-chip').textContent);

  // vocab pool
  W().location.hash = '#/vocab';
  await until(() => D().querySelector('.tiles'));
  const tiles = [...D().querySelectorAll('.tile .v')].map((t) => t.textContent);
  ok(tiles[1] === '13', `known words after paging: ${tiles[1]} (expect 13 = 16 unique − comida − muy − rica)`);
  ok(tiles[2] === '2', `LingQs: ${tiles[2]} (comida + "muy rica")`);

  // automatic changes are listed and can be reverted
  W().location.hash = '#/vocab/auto';
  await until(() => D().querySelector('[data-f="auto"].on'));
  const autoRows = D().querySelectorAll('#table tbody tr').length;
  ok(autoRows === 13, `auto-changed filter lists ${autoRows} words (13 known; the phrase was then set manually)`);
  D().querySelector('[data-revert="hola"]').click();
  await until(() => !D().querySelector('[data-revert="hola"]'));
  W().location.hash = '#/vocab';
  await until(() => D().querySelector('[data-f="new"].on') && D().querySelector('.tiles'));
  ok(D().querySelectorAll('.tile .v')[1].textContent === '12', 'revert moved "hola" back out of known');

  // review
  W().location.hash = '#/review';
  await until(() => D().getElementById('show'));
  ok(!!D().getElementById('show'), 'review card shown');
  D().getElementById('show').click();
  await until(() => D().querySelector('[data-g="good"]'));
  ok(/food|muy rica|comida/.test(D().getElementById('view').textContent), 'card shows the term');
  D().querySelector('[data-g="good"]').click();
  await sleep(300);

  // stats
  W().location.hash = '#/stats';
  await until(() => D().querySelector('#chart svg g.col'));
  ok(D().querySelectorAll('#chart svg g.col').length === 30, 'stats chart rendered 30 days');
  ok(D().querySelectorAll('#chart svg path.bar').length >= 1, 'chart has a bar for today');

  // library
  W().location.hash = '#/library';
  await until(() => D().querySelector('.lesson-card'));
  ok(/Prueba/.test(D().querySelector('.lesson-card').textContent), 'lesson in library');

  // ---- listen mode: a YouTube lesson; the video drives the transcript ----
  const lines = ['El perro corre por el parque.', 'Mi gato duerme todo el día.'];
  for (let i = 2; i < 40; i++) lines.push(`Esta es la frase número ${i} del vídeo largo.`);
  const ts = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  await importLesson('Vídeo', lines.map((l, i) => `${ts(i * 4)}\n${l}`).join('\n'), 'https://www.youtube.com/watch?v=dQw4w9WgXcQ');
  const V = () => D().getElementById('view');
  ok(V().classList.contains('listen') && D().querySelector('.follow-bar') && !D().querySelector('.pager'), 'timed lesson with video → listen mode');
  ok(fake.media?.youtubeId === 'dQw4w9WgXcQ', 'player created for the YouTube video');
  ok(D().querySelectorAll('.cue-time').length === 40, 'every line has a timestamp button');

  const inBand = (i) => {
    const p = D().querySelector(`#reader p[data-i="${i}"]`).getBoundingClientRect();
    const top = D().getElementById('media').getBoundingClientRect().bottom;
    const bottom = D().querySelector('.follow-bar').getBoundingClientRect().top;
    return p.top >= top - 2 && p.top <= top + 0.6 * (bottom - top);
  };
  fake.set(5, true);
  await until(() => D().querySelector('#reader p.playing'));
  ok(D().querySelector('#reader p.playing')?.dataset.i === '1', 'video at 0:05 highlights the line starting at 0:04');
  fake.set(81);                                    // jump to line 20
  await until(() => D().querySelector('#reader p.playing')?.dataset.i === '20' && inBand(20));
  ok(inBand(20), 'after a jump the spoken line is scrolled into the reading spot below the player');
  fake.set(85); fake.set(89);                      // natural progress to line 22
  await until(() => D().querySelector('#reader p.playing')?.dataset.i === '22');
  await sleep(700);                                // smooth scroll
  ok(inBand(22), 'text keeps up with the video as lines advance');

  D().body.dispatchEvent(new WheelEvent('wheel', { bubbles: true, deltaY: -200 }));
  await sleep(50);
  ok(!D().getElementById('follow-btn').hidden, 'scrolling yourself pauses following and shows "Follow video"');
  W().scrollTo(0, 0);
  const y0 = W().scrollY;
  fake.set(101);                                   // line 25
  await sleep(400);
  ok(W().scrollY === y0, 'while paused, the text is not dragged back');
  D().getElementById('follow-btn').click();
  await until(() => inBand(25));
  ok(inBand(25) && D().getElementById('follow-btn').hidden, '"Follow video" jumps back to the spoken line');

  let aiInput = null;
  W().__lingoAI = async (input) => { aiInput = input; return {
    gloss_in_context: 'this (pointing at the sentence)', lemma: 'este', part_of_speech: 'determiner',
    grammar_note: 'Feminine singular demonstrative.', multiword_unit: null, sentence_translation: 'This is sentence 25.',
  }; };
  D().querySelector('#reader p[data-i="25"] .w').click();
  await until(() => !D().getElementById('word-panel').hidden);
  ok(!fake.playing, 'tapping a word pauses the video');
  await until(() => /pointing at the sentence/.test(D().querySelector('#ai-area')?.textContent || ''));
  ok(/Feminine singular/.test(D().querySelector('#ai-area')?.textContent || ''), 'on-device AI explanation shown with a grammar note');
  ok(aiInput?.sentence === lines[25] && aiInput.prev === lines[24] && aiInput.next === lines[26], 'AI gets the sentence plus the previous and next lines');

  // "Still unclear?": stronger free model in the panel, DeepSeek / ChatGPT in the browser
  W().__lingoAssist = async (input) => ({ model: 'test/free-model:free', result: {
    gloss_in_context: 'this one', lemma: 'este', part_of_speech: 'determiner', grammar_note: 'Agrees with "frase".',
    multiword_unit: null, explanation: 'Points at the sentence being spoken.', example: 'Esta casa es grande. — This house is big.' } });
  const opened = [];
  const realOpen = W().open;
  W().open = (url) => { opened.push(url); return null; };
  D().querySelector('#word-panel details.assist summary').click();
  D().querySelector('#word-panel [data-act="assist"]').click();
  await until(() => /Points at the sentence/.test(D().querySelector('#assist-area')?.textContent || ''));
  ok(/test\/free-model:free/.test(D().querySelector('#assist-area').textContent), 'stronger free model answer shown in the panel');
  D().querySelector('#word-panel [data-act="chatgpt"]').click();
  D().querySelector('#word-panel [data-act="deepseek"]').click();
  await until(() => opened.length === 2);
  ok(opened[0].startsWith('https://chatgpt.com/?temporary-chat=true&q=') && decodeURIComponent(opened[0]).includes(lines[25]),
    'Ask ChatGPT opens a temporary (private) chat with the sentence in the question');
  ok(opened[1] === 'https://chat.deepseek.com/', 'Ask DeepSeek opens DeepSeek’s free chat');
  W().open = realOpen;
  delete W().__lingoAssist;
  delete W().__lingoAI;
  D().querySelector('#word-panel [data-act="close"]').click();
  ok(fake.playing, 'closing the panel resumes it');

  fake.set(101, false);
  D().activeElement?.blur();
  D().dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
  ok(fake.seeks.at(-1) === 104, `→ jumps to the next line (seek ${fake.seeks.at(-1)})`);
  D().querySelector('[data-ctl="sync+"]').click();
  ok(D().getElementById('sync-val').textContent === '0.25s', 'sync offset adjusts');
  fake.set(104, false);

  // word-by-word progress: halfway through line 30 (4 s long), the first words are underlined, the last isn't
  fake.set(30 * 4 + 2 - 0.25, true);
  await until(() => D().querySelector('#reader p[data-i="30"] .w.spoken'));
  const l30 = [...D().querySelectorAll('#reader p[data-i="30"] .w')];
  ok(l30[0].classList.contains('spoken') && !l30.at(-1).classList.contains('spoken'), 'words of the spoken line are underlined progressively');
  fake.set(fake.t, false);

  // listening to a line all the way through is evidence for its untapped words
  async function playThrough(from, to) {
    fake.set(from, true);
    for (let t = from; t <= to; t += 0.25) { fake.set(t); await sleep(25); }
    fake.set(to, false);
    await sleep(300);
  }
  D().querySelector('#reader p[data-i="0"] .w[data-n="perro"]').click();   // tap "perro" in line 0
  await until(() => !D().getElementById('word-panel').hidden);
  D().querySelector('#word-panel [data-act="close"]').click();
  await playThrough(0, 4.2);
  const corre1 = await db.get('words', 'es|corre');
  ok(corre1?.ev?.pre === 1 && corre1.status === 0, `one listen: "corre" has 1 listening pass, still new (pre ${corre1?.ev?.pre}, status ${corre1?.status})`);
  ok((await db.get('words', 'es|perro'))?.ev?.since === 0, 'the word tapped in that line did not get a clean pass there');
  W().location.hash = '#/library';                 // a second visit counts again
  await until(() => D().querySelector('.lesson-card'));
  W().history.back();
  await until(() => V().classList.contains('listen') && D().querySelector('#reader .w'));
  await playThrough(0, 4.2);
  const corre2 = await db.get('words', 'es|corre');
  ok(corre2?.status === 5, `second untapped listen: "corre" is known (status ${corre2?.status})`);

  // ---- correcting a transcript line updates the lesson and the word pool ----
  const videoId = W().location.hash.split('/').pop();
  const before = await db.get('lessons', Number(videoId));
  const largoBefore = before.words['largo'];
  D().querySelector('#reader [data-edit="39"]').click();
  const ta39 = await until(() => D().querySelector('#reader p[data-i="39"] textarea'));
  ta39.value = 'Esta es la frase número 39 del vídeo corto.';
  D().querySelector('#reader p[data-i="39"] [data-save]').click();
  await until(() => D().querySelector('#reader p[data-i="39"] .w[data-n="corto"]'));
  const after = await db.get('lessons', Number(videoId));
  const corto = await db.get('words', 'es|corto');
  ok(after.segments[39].text.endsWith('vídeo corto.') && after.words['corto'] === 1 && after.words['largo'] === largoBefore - 1,
    'edited line saved and lesson word counts updated');
  ok(corto?.freq === 1 && corto.lessons.includes(after.id) && corto.status === 0, 'a word introduced by the correction joins the pool as new');

  // ---- transcript check against the audio (audio + Whisper stubbed) ----
  const wavSilence = (() => {
    const n = 16000, b = new ArrayBuffer(44 + n * 2), v = new DataView(b);
    const s = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    s(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); s(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
    v.setUint16(22, 1, true); v.setUint32(24, 16000, true); v.setUint32(28, 32000, true); v.setUint16(32, 2, true);
    v.setUint16(34, 16, true); s(36, 'data'); v.setUint32(40, n * 2, true);
    return b;
  })();
  const realFetch0 = W().fetch;
  W().fetch = async (url, ...rest) => String(url).startsWith('api/audio')
    ? new Response(wavSilence.slice(0), { headers: { 'content-type': 'audio/wav' } }) : realFetch0(url, ...rest);
  W().__lingoASR = async () => [
    { start: 8, end: 12, text: 'Esta es la frase número dos del video largo.' },
    { start: 12, end: 16, text: 'Esta es la frase número tres del vídeo largo.' },
  ];
  D().querySelector('[data-ctl="check"]').click();
  await until(() => D().querySelector('#reader p[data-i="2"] .w[data-flag]'));
  const flagged = [...D().querySelectorAll('#reader .w[data-flag]')];
  ok(flagged.length === 1 && flagged[0].dataset.n === 'vídeo' && flagged[0].closest('p').dataset.i === '2', 'check flags only the word the audio says differently (line 2, vídeo/video)');
  ok(/1 possible mistake/.test(D().getElementById('check-status').textContent), 'flag count shown');
  flagged[0].click();
  await until(() => D().querySelector('#word-panel .flag-box'));
  D().querySelector('#word-panel [data-act="flag-replace"]').click();
  await until(() => !D().querySelector('#reader .w[data-flag]'));
  const fixed = await db.get('lessons', Number(videoId));
  ok(fixed.segments[2].text === 'Esta es la frase número 2 del video largo.' && !fixed.flags[2], 'Replace corrects the transcript and clears the flag');
  W().fetch = realFetch0;
  delete W().__lingoASR;

  // flag a stretch spanning two lines yourself
  const r56 = D().createRange();
  r56.setStartBefore(D().querySelector('#reader p[data-i="5"] .w[data-n="frase"]'));
  r56.setEndAfter(D().querySelector('#reader p[data-i="6"] .w[data-n="es"]'));
  W().getSelection().removeAllRanges(); W().getSelection().addRange(r56);
  D().getElementById('reader').dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
  await until(() => D().querySelector('#word-panel .small-title'));
  ok(/Selected text/.test(D().querySelector('#word-panel').textContent), 'selecting across lines opens the selected-text panel');
  D().querySelector('#word-panel [data-act="flag-wrong"]').click();
  await until(() => D().querySelector('#reader p[data-i="6"] .w[data-flag]'));
  const manual = await db.get('lessons', Number(videoId));
  ok(manual.flags[5]?.[0].manual && manual.flags[5][0].said === 'frase número 5 del vídeo largo' && manual.flags[6]?.[0].said === 'Esta es',
    'flag as wrong marks the selected text on both lines ' + JSON.stringify([manual.flags[5], manual.flags[6]]));

  // ---- automatic transcript from just a YouTube link (server response stubbed) ----
  const realFetch = W().fetch;
  W().fetch = async (url, ...rest) => String(url).startsWith('api/transcript')
    ? new Response(JSON.stringify({ ok: true, title: 'Vídeo automático', vtt: AUTO_VTT,
        track: { index: 0, lang: 'es', kind: 'auto', name: 'Spanish (auto-generated)' },
        tracks: [{ index: 0, lang: 'es', kind: 'auto', name: 'Spanish (auto-generated)' }, { index: 1, lang: 'en', kind: 'manual', name: 'English' }] }),
        { headers: { 'content-type': 'application/json' } })
    : realFetch(url, ...rest);
  W().location.hash = '#/import';
  await until(() => D().getElementById('yt'));
  const ytInput = D().getElementById('yt');
  ytInput.value = 'https://youtu.be/dQw4w9WgXcQ';
  ytInput.dispatchEvent(new Event('input'));
  await until(() => /WEBVTT/.test(D().getElementById('text').value));
  ok(/^✓ Loaded/.test(D().getElementById('yt-status').textContent) && D().getElementById('title').value === 'Vídeo automático',
    'pasting a link fetches the transcript and title: ' + D().getElementById('yt-status').textContent);
  ok(!D().getElementById('yt-track').hidden && D().getElementById('yt-track').options.length === 2, 'other caption tracks can be chosen');
  D().getElementById('go').click();
  await until(() => V().classList.contains('listen') && D().querySelector('#reader .w'));
  const autoLesson = await db.get('lessons', Number(W().location.hash.split('/').pop()));
  ok(autoLesson.segments.length === 1 && autoLesson.segments[0].marks?.length === 5, 'auto-captions became one sentence with word timings');
  W().fetch = realFetch;

  // ---- AI transcription from a YouTube link (audio download and Whisper stubbed) ----
  const wav = (() => { // 1 s of silence, 16 kHz mono PCM
    const n = 16000, b = new ArrayBuffer(44 + n * 2), v = new DataView(b);
    const s = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    s(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); s(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
    v.setUint16(22, 1, true); v.setUint32(24, 16000, true); v.setUint32(28, 32000, true); v.setUint16(32, 2, true);
    v.setUint16(34, 16, true); s(36, 'data'); v.setUint32(40, n * 2, true);
    return b;
  })();
  W().fetch = async (url, ...rest) => String(url).startsWith('api/audio')
    ? new Response(wav.slice(0), { headers: { 'content-type': 'audio/wav' } }) : realFetch(url, ...rest);
  let asrLang = null;
  W().__lingoASR = async (audio, { lang, onProgress }) => {
    asrLang = lang;
    onProgress({ stage: 'transcribe', done: 0, total: 1 });
    return [{ start: 0, end: 2, text: 'Hola, esto es una prueba.' }, { start: 2, end: 4, text: 'La inteligencia artificial escribe.' }];
  };
  W().location.hash = '#/import';
  await until(() => D().getElementById('ai-yt'));
  D().getElementById('yt').value = 'https://youtu.be/dQw4w9WgXcQ';
  D().getElementById('text').value = '';
  D().getElementById('ai-yt').click();
  await until(() => /Transcribed/.test(D().getElementById('yt-status').textContent));
  ok(/✓ Transcribed 2 lines/.test(D().getElementById('yt-status').textContent) && asrLang === 'es', 'AI transcription fills the transcript: ' + D().getElementById('yt-status').textContent);
  ok(/00:00:02\.000 --> 00:00:04\.000\nLa inteligencia artificial escribe\./.test(D().getElementById('text').value), 'AI transcript is timed (WebVTT)');
  D().getElementById('go').click();
  await until(() => V().classList.contains('listen') && /inteligencia/.test(D().getElementById('reader').textContent));
  const asrLesson = await db.get('lessons', Number(W().location.hash.split('/').pop()));
  ok(asrLesson.asr === true && asrLesson.segments.length === 2, 'lesson remembers it was transcribed by AI');
  W().fetch = realFetch;
  delete W().__lingoASR;

  ok(!D().body.dataset.error, 'no runtime errors: ' + (D().body.dataset.error || 'none'));
} catch (e) {
  ok(false, 'exception: ' + e.stack);
}
document.getElementById('out').textContent = `${fails ? 'FAILED ' + fails : 'ALL PASSED'}\n` + log.join('\n');
document.body.dataset.done = '1';
</script>
