<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <title>Lingo Reader</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/library">Lingo<span>Reader</span></a>
    <div class="topbar-right">
      <a id="account-btn" href="#/account" aria-label="Account"><span class="acc-dot" aria-hidden="true"></span><span class="acc-name">Guest</span></a>
      <select id="lang-select" aria-label="Language you are studying"></select>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Main">
    <a href="#/library" data-tab="library"><span aria-hidden="true">📚</span>Library</a>
    <a href="#/import" data-tab="import"><span aria-hidden="true">➕</span>Import</a>
    <a href="#/review" data-tab="review"><span aria-hidden="true">🃏</span>Review</a>
    <a href="#/vocab" data-tab="vocab"><span aria-hidden="true">🔤</span>Vocab</a>
    <a href="#/stats" data-tab="stats"><span aria-hidden="true">📈</span>Stats</a>
    <a href="#/settings" data-tab="settings"><span aria-hidden="true">⚙️</span>Settings</a>
  </nav>

  <aside id="word-panel" class="panel" hidden aria-label="Word details"></aside>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
